<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card2</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            background: #8cc2f9;
            background-image:linear-gradient(45deg, #8cc2f9 0.000%, #8bd0ff 25.000%, #9fd4ff 50.000%, #bfceff 75.000%, #ddc0ff 100.000%);
            display: flex;
            justify-content: center;
            align-items:center;
        }
        .card{
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;


        }
        .card img{
            width: 100%;
            height: 30%;
            border-top-left-radius:20px ;
            border-top-right-radius:20px ;
        }
        .textBox{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 75%;
            text-align: center;
        }
        #amountBox{
            width: 80%;
            height: 10%;
            background-color: #8cc2f9;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right:20px ;
            padding-left: 20px;

        }
        .card button{
            width: 80%;
            height: 9%;
            background-color: #0e185a;
            border-radius: 10px;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }
        #cancelBox{
            text-decoration: none;
            color: rgb(63, 57, 57);
            font-weight: bold;
            font-size: large;
        }
        .leftbox{
            width:fit-content ;
            display: flex;
            align-items: center;
            gap: 15px;
            height: 100%;
        }
        .imgbox img{
            height: 3.5rem;
            width: 3.5rem;
        }
        @media (max-width:400px){
            #amountBox{
                flex-direction: column;
                height: fit-content;
                padding-bottom:10px ;
                gap: 20px;
            }
             .leftbox{ 
                flex-direction: column;
            } 
        } 

    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="images/icon.jpg" alt="img">
            <div class="textBox">
                  <h2>
                Order Summary
            </h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Hic sed expedita excepturi commodi esse et quam odit dicta eum impedit.</p>

            </div>
            <div id="amountBox">
                <div class="leftbox">
                    <div class="imgbox">
                        <img src="images/music.png" alt="img">

                    </div>
                    <div id="textamountbox">
                        <p>Amount</p>
                        <p>99.99/year</p>
                    </div>



                </div>
                <div class="rightbox">
                    <a href="#">Change</a>
                </div>
            </div>
            <button>
                Prceed to payment
            </button>
            <a id="cancelBox" href="#">Cancel Order</a>
          


        </div>

    </div>
</body>
</html>
