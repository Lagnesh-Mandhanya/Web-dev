<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Event Registration</h2>
    <label for="name">Name:</label>
    <input type="text" name="name" id="name">
    <br>
    <br>
     <label for="email">Email:</label>
    <input type="email" name="email" id="email">
    <br>
    <br>
     <label for="phone">Phone no:</label>
    <input type="tel" name="phone" id="phone" pattern="[0-9]{10}" title="Enter exact 10 numbers">

    <br>
    <br>
    <label for="occupationType">Occupation:</label>
    <select name="occupation" id="occupationType">
        <option value="">Student</option>
        <option value="">Professional</option>
        <option value="">Other</option>
    </select>
    <br>
    <br>
    <fieldset>
        <legend>Topic of interest</legend>
        <label for="checkbox1">HTML</label>
        <input checked type="checkbox" name="checkbox" id="checkbox1">

           <label for="checkbox2">CSS</label>
        <input type="checkbox" name="checkbox" id="checkbox2">

           <label for="checkbox3">JavaScript</label>
        <input type="checkbox" name="checkbox" id="checkbox3">
    </fieldset>
    <br>
    <label for="textarea1">Comments:</label>
    <br>
    <textarea name="textarea1" id="textarea1" cols="30" rows="10"></textarea>
    <input type="button" value="Register">


</body>
</html>
